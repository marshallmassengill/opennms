name: syslog-tcp-test

# An OpenNMS core and a Minion, both listening for syslog over TCP and TLS, plus an
# isolated Postgres. Both OpenNMS containers idle on `sleep infinity` and are started by
# hand through docker exec, following the same pattern as dev/ha-test, so a restart or a
# reload can be driven precisely from the verification scripts.
#
# Senders are not declared here. run-matrix.sh starts an rsyslog or syslog-ng container per
# cell with a generated config, because each cell needs different framing and transport.

services:
  syslog-tcp-postgres:
    image: postgres:15
    container_name: syslog-tcp-postgres
    hostname: syslog-tcp-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - syslog-tcp

  syslog-tcp-core:
    image: syslog-tcp-test-base:21
    build: .
    container_name: syslog-tcp-core
    hostname: syslog-tcp-core
    # bin/install and bin/opennms resolve their helpers relative to this.
    environment:
      OPENNMS_HOME: /opt/opennms
      # service-configuration.xml gates Syslogd on this; it defaults to false.
      CORE_SERVICE_SYSLOGD_ENABLED: "true"

    command: ["sleep", "infinity"]
    depends_on:
      syslog-tcp-postgres:
        condition: service_healthy
    volumes:
      - ./core:/opt/opennms
      - ./certs:/opt/opennms/syslog-certs:ro
      # The dir assembly does not ship the jrrd2 bindings the default RRD strategy needs.
      - /usr/lib/jni:/usr/lib/jni:ro
      - /usr/share/java:/usr/share/java:ro
    ports:
      - "8985:8980"
      - "8106:8101"
      # Published on the host so the sender containers can reach them over loopback.
      - "10516:10516/udp"
      - "10601:10601"
      - "10614:10614"
    networks:
      - syslog-tcp

  syslog-tcp-minion:
    image: syslog-tcp-test-base:21
    build: .
    # The minion's karaf script does not drop privileges, so run as the host user that
    # owns the bind mount instead.
    user: "1000:1000"
    container_name: syslog-tcp-minion
    hostname: syslog-tcp-minion
    environment:
      MINION_HOME: /opt/minion
      KARAF_HOME: /opt/minion
    command: ["sleep", "infinity"]
    depends_on:
      - syslog-tcp-core
    volumes:
      - ./minion:/opt/minion
      - ./certs:/opt/minion/syslog-certs:ro
    ports:
      - "8206:8201"
      - "11514:11514/udp"
      - "11601:11601"
      - "11614:11614"
    networks:
      - syslog-tcp

networks:
  syslog-tcp:
